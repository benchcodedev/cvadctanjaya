<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F5550"/>
      <stop offset="55%" stop-color="#3F6F6A"/>
      <stop offset="100%" stop-color="#2F4A4F"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#C8A45D" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#FAF7F2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2F5550" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="siloBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6EFEA" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#FAF7F2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3F6F6A" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="moundWarm" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#DEC09A"/>
      <stop offset="55%" stop-color="#B89467"/>
      <stop offset="100%" stop-color="#784B37"/>
    </linearGradient>
    <linearGradient id="moundCoconut" x1="25%" y1="10%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#9C6952"/>
      <stop offset="60%" stop-color="#6D4834"/>
      <stop offset="100%" stop-color="#4D3122"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#heroSky)"/>
  <rect width="1440" height="900" fill="url(#goldGlow)"/>

  <!-- Architectural Precision Grid Pattern -->
  <g stroke="#FAF7F2" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="180" x2="1440" y2="180"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="540" x2="1440" y2="540"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="288" y1="0" x2="288" y2="900"/>
    <line x1="576" y1="0" x2="576" y2="900"/>
    <line x1="864" y1="0" x2="864" y2="900"/>
    <line x1="1152" y1="0" x2="1152" y2="900"/>
  </g>

  <!-- Right Side Industrial Milling Silos & Cyclone Separator Illustration -->
  <g transform="translate(760, 140)" opacity="0.88">
    <!-- Sieve Calibration Ring Backdrop -->
    <circle cx="340" cy="240" r="210" stroke="#C8A45D" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="340" cy="240" r="165" stroke="#FAF7F2" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Silo 1 -->
    <path d="M90 120 L150 75 L210 120 V390 H90 V120 Z" fill="url(#siloBody)" stroke="#C8A45D" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="90" y1="185" x2="210" y2="185" stroke="#FAF7F2" stroke-opacity="0.2"/>
    <line x1="90" y1="255" x2="210" y2="255" stroke="#FAF7F2" stroke-opacity="0.2"/>
    <line x1="90" y1="325" x2="210" y2="325" stroke="#FAF7F2" stroke-opacity="0.2"/>

    <!-- Silo 2 (Main Pulverizer Tower) -->
    <path d="M240 80 L320 25 L400 80 V390 H240 V80 Z" fill="url(#siloBody)" stroke="#C8A45D" stroke-opacity="0.65" stroke-width="1.8"/>
    <rect x="275" y="120" width="90" height="55" rx="8" fill="#2F5550" fill-opacity="0.6" stroke="#C8A45D" stroke-width="1.2"/>
    <circle cx="320" cy="245" r="42" fill="#2F5550" fill-opacity="0.7" stroke="#C8A45D" stroke-width="1.5"/>
    <path d="M300 245 H340 M320 225 V265 M306 231 L334 259 M334 231 L306 259" stroke="#C8A45D" stroke-width="1.5"/>

    <!-- Conveyor & Cyclone Classifier -->
    <path d="M400 160 L490 110 V270 L450 340 L410 270 V190" fill="url(#siloBody)" stroke="#FAF7F2" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="425" y="340" width="50" height="50" rx="6" fill="#C8A45D" fill-opacity="0.25" stroke="#C8A45D" stroke-width="1.5"/>

    <!-- Precision Powder Mounds in Foreground -->
    <ellipse cx="310" cy="445" rx="280" ry="52" fill="#2F4A4F" fill-opacity="0.5"/>
    <path d="M80 440 C145 350, 225 320, 290 320 C355 320, 425 355, 495 440 Z" fill="url(#moundWarm)" opacity="0.92"/>
    <path d="M265 455 C325 370, 395 340, 455 340 C515 340, 575 375, 630 455 Z" fill="url(#moundCoconut)" opacity="0.95"/>
    <path d="M35 450 H650" stroke="#C8A45D" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
